name: Test - Oncall

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # creates a button
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  test_on_ubuntu_container:
    runs-on: [self-hosted, Ubuntu, Docker]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # these libraries enable testing Qt on linux. The self-hosted Docker
      # runner does not include sudo, so install directly when running as root.
      - name: Install Qt runtime libraries
        run: |
          if command -v sudo >/dev/null 2>&1; then
            APT_GET="sudo apt-get"
          else
            APT_GET="apt-get"
          fi

          $APT_GET update
          DEBIAN_FRONTEND=noninteractive $APT_GET install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxkbcommon-x11-0

      # note: if you need dependencies from conda, considering using
      # setup-miniconda: https://github.com/conda-incubator/setup-miniconda
      # and
      # tox-conda: https://github.com/tox-dev/tox-conda
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools tox tox-gh-actions

      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        #uses: GabrielBB/xvfb-action@v1
        run:
            python -m tox
        env:
          PLATFORM: ubuntu-latest

      - name: Coverage
        uses: codecov/codecov-action@v3
